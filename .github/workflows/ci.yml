name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build extension zip
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          mkdir -p dist
          zip -r "dist/linkedin-puzzle-solver-$VERSION.zip" manifest.json src -x "*/.DS_Store"
          unzip -l "dist/linkedin-puzzle-solver-$VERSION.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-puzzle-solver
          path: dist/*.zip

  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: npm exec --prefix e2e -- playwright-core install --with-deps chromium
      - name: Test actual extension against offline request contracts
        run: npm run test:e2e
        env:
          E2E_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-e2e-results
          path: e2e/.e2e/
          include-hidden-files: true

  headless-service-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless service
        run: docker build -f service/Dockerfile -t linkedin-puzzles-service:test .
      - name: Verify request save and persisted completion with offline fixtures
        run: docker run --rm --init --shm-size=1g linkedin-puzzles-service:test smoke
