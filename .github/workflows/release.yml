name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match manifest.json version $VERSION." >&2
            echo "Bump manifest.json and package.json before tagging." >&2
            exit 1
          fi

      - name: Build extension zip
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          mkdir -p dist
          zip -r "dist/linkedin-puzzle-solver-$VERSION.zip" manifest.json src -x "*/.DS_Store"
          unzip -l "dist/linkedin-puzzle-solver-$VERSION.zip"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/linkedin-puzzle-solver-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
